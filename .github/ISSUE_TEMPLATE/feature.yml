name: Feature request
description: Propose a focused, evidence-backed improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Maintainer problem
      description: Describe a real workflow and its current cost.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public or sanitized evidence
      description: Link a public example or describe a safely sanitized one.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State the result without prescribing a large implementation.
    validations:
      required: true
